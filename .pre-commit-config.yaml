# Vendored directories and byte-identical frappe-agent-kit copies stay unformatted.
exclude: 'node_modules|^\.git/|^semgrep/(frappe|kit)/|^scripts/test_(deny_rules|workflow_concurrency|doc_links)\.py$'
default_stages: [pre-commit]
fail_fast: false


repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        files: "task_list.*"
        exclude: ".*json$|.*txt$|.*csv|.*md|.*svg"
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff
        name: "Run ruff import sorter"
        args: ["--select=I", "--fix"]

      - id: ruff
        name: "Run ruff linter"

      - id: ruff-format
        name: "Run ruff formatter"

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.7.1
    hooks:
      - id: prettier
        types_or: [javascript, vue, scss]
        # Ignore any files that might contain jinja / bundles
        exclude: |
            (?x)^(
                task_list/public/dist/.*|
                .*node_modules.*|
                .*boilerplate.*|
                task_list/templates/includes/.*|
                task_list/public/js/lib/.*
            )$


  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.44.0
    hooks:
      - id: eslint
        types_or: [javascript]
        args: ['--quiet']
        # Ignore any files that might contain jinja / bundles
        exclude: |
            (?x)^(
                task_list/public/dist/.*|
                cypress/.*|
                .*node_modules.*|
                .*boilerplate.*|
                task_list/templates/includes/.*|
                task_list/public/js/lib/.*
            )$

  - repo: local
    hooks:
      - id: sync-skills-check
        name: Check vendored skills and rules against skills.lock
        entry: scripts/sync-skills.sh check
        language: system
        pass_filenames: false
        files: ^(skills\.lock|AGENTS\.md|\.agents/|semgrep/)

      - id: deny-rules-in-step
        name: Check Codex and Claude Code deny rules match
        entry: python3 scripts/test_deny_rules.py
        language: system
        pass_filenames: false
        files: ^(\.claude/settings\.json|\.codex/rules/)

      - id: workflow-concurrency
        name: Check CI concurrency contract
        entry: python3 scripts/test_workflow_concurrency.py .github/workflows/ci.yml .github/workflows/linter.yml
        language: system
        pass_filenames: false
        files: ^\.github/workflows/

      - id: semgrep-kit
        name: Kit Semgrep rules (no commit or rollback)
        entry: semgrep scan --error --metrics=off --severity ERROR --config semgrep/kit/transactions.yml --exclude semgrep
        language: system
        pass_filenames: false
        types: [python]

ci:
    autoupdate_schedule: weekly
    skip: []
    submodules: false
